services:
  mongodb:
    image: mongo:7
    container_name: booking-mongo
    restart: unless-stopped
    ports:
      - "27020:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking-service:
    build: .
    container_name: booking-service
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MONGODB_URI: mongodb://mongodb:27017/booking_db
    depends_on:
      mongodb:
        condition: service_healthy

volumes:
  mongo-data:
