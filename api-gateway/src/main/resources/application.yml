server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://auth-service:8081
          predicates:
            - Path=/api/auth/**
        - id: hotel-service
          uri: http://hotel-service:8082
          predicates:
            - Path=/api/hotels/**
        - id: booking-service
          uri: http://booking-service:8083
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: http://payment-service:8084
          predicates:
            - Path=/api/payments/**

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

app:
  api-key: GATEWAY_SECRET
  api-keys:
    auth: AUTH_SECRET_12345
    hotel: HOTEL_SECRET_67890
    booking: BOOKING_SECRET_11111
    payment: PAYMENT_SECRET_22222
  jwt:
    secret: ubqBq8o9co+y1lA+viUYAnWt1toPVlGGbOdQp/tfisjaacx3dPFM6FjXchLfyWQ8
