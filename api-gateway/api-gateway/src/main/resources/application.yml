server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/auth/**
        - id: hotel-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/hotels/**
        - id: booking-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/bookings/**
        - id: payment-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/payments/**
  data:
    redis:
      host: localhost
      port: 6379

management:
  health:
    redis:
      enabled: false

logging:
  level:
    org.springframework.cloud.gateway: DEBUG

app:
  api-keys:
    auth: AUTH_SECRET_12345
    hotel: HOTEL_SECRET_67890
    booking: BOOKING_SECRET_11111
    payment: PAYMENT_SECRET_22222
  jwt:
    secret: mySuperSecretKeyThatShouldBeAtLeast32CharactersLong